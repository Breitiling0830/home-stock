<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家裡還有嗎？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F7;
  --card:#FFFFFF;
  --card2:#F5F3F0;
  --ink:#28241F;
  --sub:#9C9691;
  --faint:#C6C1BA;
  --line:#F0EDE8;
  --coral:#E56A45;
  --coral-deep:#D95B39;
  --coral-soft:#FBEAE3;
  --tea:#B9A489;
  --tea-soft:#F6F0E8;
  --green:#7FA37A;
  --green-soft:#E9EFE6;
  --amber:#D9A248;
  --amber-soft:#F8EDD8;
  --red:#D9553B;
  --red-soft:#FAE4DE;
  --purple:#9C89BD;
  --purple-soft:#EEE9F4;
  --blue:#7E9BB5;
  --blue-soft:#E5EBF1;
  --sh-out:0 1px 4px rgba(60,45,30,.05);
  --sh-out-sm:0 1px 2px rgba(60,45,30,.04);
  --sh-in:none;
  --r-lg:18px; --r-md:16px; --r-sm:12px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Quicksand','Noto Sans TC',system-ui,sans-serif;
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
}
#app{max-width:480px;margin:0 auto;padding:0 18px 110px;position:relative;min-height:100vh;}

/* ---------- header ---------- */
.app-header{padding:26px 4px 6px;display:flex;align-items:center;justify-content:space-between;}
.app-title{font-size:24px;font-weight:900;letter-spacing:1px;}
.app-title .q{color:var(--coral);}
.app-sub{font-size:12px;color:var(--sub);margin-top:2px;}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);
  background:var(--card);border-radius:999px;padding:7px 12px;box-shadow:var(--sh-out-sm);cursor:pointer;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);}
.sync-dot.on{background:var(--green);}

/* ---------- search ---------- */
.search-wrap{margin:14px 0 4px;position:relative;}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint);}
.search-input{width:100%;border:none;outline:none;background:var(--card2);color:var(--ink);
  border-radius:999px;padding:13px 42px;font-size:14px;box-shadow:var(--sh-in);font-family:inherit;}
.search-input::placeholder{color:var(--faint);}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;
  color:var(--faint);font-size:16px;cursor:pointer;padding:6px;display:none;}

/* ---------- chips ---------- */
.chip-row{display:flex;gap:9px;overflow-x:auto;padding:12px 2px 14px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;border:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--sub);
  background:var(--card);border-radius:999px;padding:9px 15px;box-shadow:var(--sh-out-sm);cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:all .15s;}
.chip.active{background:var(--coral);color:#fff;box-shadow:inset 3px 3px 7px rgba(150,70,45,.3);}
.chip .cnt{font-size:10.5px;background:rgba(0,0,0,.07);border-radius:999px;padding:1px 7px;}
.chip.active .cnt{background:rgba(255,255,255,.25);}

/* ---------- section titles ---------- */
.sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;margin:18px 2px 12px;}
.sec-title .dot{width:9px;height:9px;border-radius:50%;background:var(--coral);}
.sec-title .more{margin-left:auto;font-size:12px;color:var(--sub);font-weight:500;cursor:pointer;}

/* ---------- item cards ---------- */
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.item-card{background:var(--card);border-radius:var(--r-lg);padding:16px 15px 13px;box-shadow:var(--sh-out);
  cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px;transition:transform .12s;}
.item-card:active{transform:scale(.97);}
.ic-top{display:flex;align-items:flex-start;justify-content:space-between;}
.ic-icon{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-out-sm);}
.ic-icon svg{width:24px;height:24px;}
.badge{font-size:10px;font-weight:900;border-radius:999px;padding:3px 9px;letter-spacing:.5px;}
.badge.low{background:var(--amber-soft);color:#B37F1E;}
.badge.out{background:var(--red-soft);color:var(--red);}
.badge.exp{background:var(--purple-soft);color:#7D6B9E;}
.badge.ok{background:var(--green-soft);color:#6E8A66;}
.ic-name{font-size:15px;font-weight:900;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ic-cat{font-size:11px;color:var(--sub);}
.ic-qty{display:flex;align-items:baseline;gap:4px;margin-top:2px;}
.ic-qty b{font-size:24px;font-weight:900;color:var(--ink);}
.ic-qty.warn b{color:var(--amber);}
.ic-qty.zero b{color:var(--red);}
.ic-qty span{font-size:12px;color:var(--sub);}
.ic-date{font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:4px;}
.ic-date svg{width:11px;height:11px;}
.ic-actions{display:flex;gap:8px;margin-top:8px;}
.mini-btn{flex:1;border:none;font-family:inherit;font-size:12px;font-weight:700;border-radius:999px;
  padding:8px 0;cursor:pointer;transition:transform .1s;}
.mini-btn:active{transform:scale(.94);}
.mini-btn.use{background:var(--card2);color:var(--sub);box-shadow:var(--sh-out-sm);}
.mini-btn.buy{background:var(--coral-soft);color:var(--coral-deep);box-shadow:var(--sh-out-sm);}

/* recent purchase strip */
.recent-strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;}
.recent-strip::-webkit-scrollbar{display:none;}
.recent-card{flex:0 0 150px;background:var(--card);border-radius:var(--r-md);padding:13px 14px;
  box-shadow:var(--sh-out-sm);cursor:pointer;}
.recent-card .rc-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-card .rc-info{font-size:11px;color:var(--sub);margin-top:3px;}
.recent-card .rc-note{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}

/* empty state */
.empty{text-align:center;color:var(--faint);padding:44px 20px;font-size:13.5px;}
.empty .big{font-size:40px;margin-bottom:10px;}

/* ---------- category page ---------- */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
.cat-card{background:var(--card);border-radius:var(--r-lg);padding:20px 16px;box-shadow:var(--sh-out);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s;}
.cat-card:active{transform:scale(.96);}
.cat-card .cc-icon{width:56px;height:56px;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-out-sm);}
.cat-card .cc-icon svg{width:28px;height:28px;}
.cat-card .cc-name{font-size:14px;font-weight:900;}
.cat-card .cc-cnt{font-size:11.5px;color:var(--sub);}

/* ---------- forms ---------- */
.form-card{background:var(--card);border-radius:var(--r-lg);padding:20px 18px;box-shadow:var(--sh-out);margin-top:14px;}
.f-label{font-size:12.5px;font-weight:900;color:var(--sub);margin:16px 2px 8px;display:flex;align-items:center;gap:6px;}
.f-label:first-child{margin-top:0;}
.f-label .req{color:var(--coral);}
.f-input,.f-textarea{width:100%;border:none;outline:none;background:var(--card2);color:var(--ink);
  border-radius:var(--r-sm);padding:12px 15px;font-size:14px;font-family:inherit;box-shadow:var(--sh-in);}
.f-textarea{resize:none;min-height:66px;}
.f-input::placeholder,.f-textarea::placeholder{color:var(--faint);}
.f-row{display:flex;gap:12px;}
.f-row>div{flex:1;}
.cat-chips{display:flex;flex-wrap:wrap;gap:8px;}
.cat-chip{border:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--sub);
  background:var(--card2);border-radius:999px;padding:8px 14px;box-shadow:var(--sh-out-sm);cursor:pointer;
  display:flex;align-items:center;gap:5px;}
.cat-chip svg{width:14px;height:14px;}
.cat-chip.active{background:var(--tea);color:#fff;box-shadow:inset 3px 3px 7px rgba(120,90,55,.3);}
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.icon-cell{aspect-ratio:1;border:none;background:var(--card2);border-radius:var(--r-sm);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-out-sm);color:var(--sub);}
.icon-cell svg{width:22px;height:22px;}
.icon-cell.active{background:var(--coral-soft);color:var(--coral-deep);box-shadow:var(--sh-in);}
.stepper{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:999px;
  padding:6px;box-shadow:var(--sh-in);}
.stepper button{width:38px;height:38px;border-radius:50%;border:none;background:var(--card);
  box-shadow:var(--sh-out-sm);font-size:19px;color:var(--sub);cursor:pointer;font-family:inherit;line-height:1;}
.stepper input{flex:1;border:none;background:none;outline:none;text-align:center;font-size:19px;
  font-weight:900;color:var(--ink);font-family:inherit;width:40px;min-width:0;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--card2);
  border-radius:var(--r-sm);padding:12px 15px;box-shadow:var(--sh-in);}
.toggle-row span{font-size:13.5px;font-weight:700;color:var(--sub);}
.switch{position:relative;width:48px;height:27px;flex:0 0 auto;}
.switch input{display:none;}
.switch .track{position:absolute;inset:0;background:#E5DDCF;border-radius:999px;transition:.2s;box-shadow:var(--sh-in);}
.switch .knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  transition:.2s;box-shadow:2px 2px 5px rgba(0,0,0,.15);}
.switch input:checked ~ .track{background:var(--coral);}
.switch input:checked ~ .knob{left:24px;}
.btn-main{width:100%;border:none;font-family:inherit;font-size:15.5px;font-weight:900;letter-spacing:2px;
  background:var(--coral);color:#fff;border-radius:999px;padding:15px 0;cursor:pointer;margin-top:22px;
  box-shadow:5px 5px 14px rgba(208,118,90,.4), -4px -4px 12px rgba(255,255,255,.8);transition:transform .1s;}
.btn-main:active{transform:scale(.97);}
.btn-ghost{width:100%;border:none;font-family:inherit;font-size:14px;font-weight:700;color:var(--sub);
  background:var(--card);border-radius:999px;padding:13px 0;cursor:pointer;box-shadow:var(--sh-out-sm);margin-top:12px;}
.btn-danger-soft{background:var(--red-soft);color:var(--red);}

/* ---------- records page ---------- */
.seg{display:flex;background:var(--card2);border-radius:999px;padding:5px;box-shadow:var(--sh-in);margin-top:14px;}
.seg button{flex:1;border:none;font-family:inherit;font-size:13px;font-weight:900;color:var(--sub);
  background:none;border-radius:999px;padding:10px 0;cursor:pointer;}
.seg button.active{background:var(--card);color:var(--coral-deep);box-shadow:var(--sh-out-sm);}
.rec-list{display:flex;flex-direction:column;gap:11px;margin-top:16px;}
.rec-item{background:var(--card);border-radius:var(--r-md);padding:13px 16px;box-shadow:var(--sh-out-sm);
  display:flex;align-items:center;gap:13px;cursor:pointer;}
.rec-item .ri-icon{width:40px;height:40px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.rec-item .ri-icon svg{width:20px;height:20px;}
.rec-item .ri-body{flex:1;min-width:0;}
.rec-item .ri-name{font-size:13.5px;font-weight:900;}
.rec-item .ri-sub{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rec-item .ri-qty{font-size:13.5px;font-weight:900;flex:0 0 auto;}
.rec-item .ri-qty.plus{color:#6E8A66;}
.rec-item .ri-qty.minus{color:var(--sub);}
.rec-date-h{font-size:11.5px;font-weight:900;color:var(--faint);margin:8px 4px 0;letter-spacing:1px;}

/* ---------- profile ---------- */
.pf-card{background:var(--card);border-radius:var(--r-lg);padding:20px 18px;box-shadow:var(--sh-out);margin-top:14px;}
.pf-user{display:flex;align-items:center;gap:14px;}
.pf-ava{width:54px;height:54px;border-radius:50%;background:var(--tea-soft);display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:900;color:var(--tea);box-shadow:var(--sh-out-sm);overflow:hidden;}
.pf-ava img{width:100%;height:100%;object-fit:cover;}
.pf-name{font-size:16px;font-weight:900;}
.pf-mail{font-size:11.5px;color:var(--sub);}
.pf-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;font-size:13.5px;
  border-bottom:1px dashed #E7DECF;}
.pf-row:last-child{border-bottom:none;}
.pf-row .k{color:var(--sub);font-weight:700;}
.pf-row .v{font-weight:900;display:flex;align-items:center;gap:6px;}
.hint{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.6;}
.step-num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--coral-soft);
  color:var(--coral-deep);font-size:11px;font-weight:900;align-items:center;justify-content:center;margin-right:7px;flex:0 0 auto;}
.setup-step{display:flex;gap:4px;font-size:12.5px;color:var(--sub);margin:9px 0;line-height:1.6;}
.code-box{background:#4A4238;color:#EAD9C4;font-size:10.5px;border-radius:var(--r-sm);padding:12px;
  font-family:monospace;white-space:pre-wrap;word-break:break-all;line-height:1.5;max-height:150px;overflow:auto;}

/* ---------- detail sheet ---------- */
.sheet-mask{position:fixed;inset:0;background:rgba(80,68,55,.35);backdrop-filter:blur(3px);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .22s;}
.sheet-mask.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:50%;transform:translate(-50%,105%);bottom:0;width:100%;max-width:480px;z-index:51;
  background:var(--bg);border-radius:30px 30px 0 0;max-height:92vh;overflow-y:auto;padding:10px 20px 34px;
  transition:transform .28s cubic-bezier(.32,.72,.33,1);}
.sheet.show{transform:translate(-50%,0);}
.sheet-bar{width:44px;height:5px;border-radius:99px;background:#DCD2C0;margin:6px auto 14px;}
.dt-head{display:flex;align-items:center;gap:15px;}
.dt-icon{width:62px;height:62px;border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-out);}
.dt-icon svg{width:32px;height:32px;}
.dt-name{font-size:20px;font-weight:900;}
.dt-cat{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-top:2px;}
.dt-tools{margin-left:auto;display:flex;gap:9px;}
.tool-btn{width:38px;height:38px;border-radius:14px;border:none;background:var(--card);box-shadow:var(--sh-out-sm);
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);}
.tool-btn svg{width:17px;height:17px;}
.tool-btn.danger{color:var(--red);}
.dt-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.dt-stat{background:var(--card);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--sh-out-sm);}
.dt-stat .k{font-size:11px;color:var(--sub);font-weight:700;}
.dt-stat .v{font-size:19px;font-weight:900;margin-top:3px;}
.dt-stat .v small{font-size:12px;color:var(--sub);font-weight:700;}
.dt-note{background:var(--tea-soft);border-radius:var(--r-md);padding:12px 16px;font-size:12.5px;color:#8A7355;margin-top:12px;}
.dt-actions{display:flex;gap:12px;margin-top:18px;}
.big-btn{flex:1;border:none;font-family:inherit;font-size:15px;font-weight:900;letter-spacing:2px;
  border-radius:999px;padding:14px 0;cursor:pointer;transition:transform .1s;}
.big-btn:active{transform:scale(.96);}
.big-btn.use{background:var(--card);color:var(--ink);box-shadow:var(--sh-out);}
.big-btn.buy{background:var(--coral);color:#fff;box-shadow:5px 5px 14px rgba(208,118,90,.4),-4px -4px 12px rgba(255,255,255,.8);}
.hist-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px;}
.hist-table th{text-align:left;color:var(--faint);font-size:11px;font-weight:900;padding:8px 6px;border-bottom:1px dashed #E7DECF;}
.hist-table td{padding:9px 6px;border-bottom:1px dashed #EFE8DA;color:var(--ink);}
.hist-table td.n{color:var(--sub);font-size:11.5px;}
.meta-line{font-size:10.5px;color:var(--faint);margin-top:16px;text-align:center;line-height:1.7;}

/* ---------- modal ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(80,68,55,.4);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-mask.show{opacity:1;pointer-events:auto;}
.modal{background:var(--bg);border-radius:28px;width:100%;max-width:360px;padding:24px 22px;
  transform:scale(.92);transition:transform .2s;max-height:86vh;overflow-y:auto;}
.modal-mask.show .modal{transform:scale(1);}
.m-title{font-size:17px;font-weight:900;text-align:center;}
.m-sub{font-size:12px;color:var(--sub);text-align:center;margin-top:4px;}
.quick-qty{display:flex;gap:10px;margin-top:16px;}
.quick-qty button{flex:1;border:none;font-family:inherit;background:var(--card);border-radius:var(--r-sm);
  padding:12px 0;font-size:13.5px;font-weight:900;color:var(--ink);box-shadow:var(--sh-out-sm);cursor:pointer;}
.quick-qty button.active{background:var(--coral-soft);color:var(--coral-deep);box-shadow:var(--sh-in);}
.m-btns{display:flex;gap:11px;margin-top:22px;}
.m-btns button{flex:1;border:none;font-family:inherit;font-size:14px;font-weight:900;border-radius:999px;
  padding:13px 0;cursor:pointer;letter-spacing:1px;}
.m-cancel{background:var(--card);color:var(--sub);box-shadow:var(--sh-out-sm);}
.m-ok{background:var(--coral);color:#fff;box-shadow:4px 4px 12px rgba(208,118,90,.4);}
.m-ok.danger{background:var(--red);box-shadow:4px 4px 12px rgba(217,112,91,.4);}
.m-ok:disabled{opacity:.5;}

/* ---------- bottom nav ---------- */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;
  background:rgba(251,248,242,.92);backdrop-filter:blur(12px);border-radius:28px 28px 0 0;
  box-shadow:0 -6px 22px rgba(184,167,142,.28);display:flex;justify-content:space-around;align-items:flex-end;
  padding:10px 8px calc(12px + env(safe-area-inset-bottom));}
.nav-btn{border:none;background:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:10px;font-weight:700;color:var(--faint);cursor:pointer;padding:4px 10px;width:62px;}
.nav-btn svg{width:22px;height:22px;}
.nav-btn.active{color:var(--coral-deep);}
.nav-add{width:54px;height:54px;border-radius:50%;border:none;background:var(--coral);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-top:-24px;
  box-shadow:5px 5px 14px rgba(208,118,90,.45),-3px -3px 10px rgba(255,255,255,.8);transition:transform .1s;}
.nav-add:active{transform:scale(.93);}
.nav-add svg{width:24px;height:24px;}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);z-index:99;
  background:#5B5147;color:#FBF8F2;font-size:13px;font-weight:700;border-radius:999px;padding:11px 22px;
  opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.page{display:none;animation:fadein .2s;}
.page.show{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.hide{display:none !important;}

/* ===== 新版 UI 覆寫（大人手冊風格）===== */
#app{padding-bottom:130px;}
.app-title{font-size:21px;letter-spacing:2px;}
.sync-pill{background:#fff;border:1px solid var(--line);box-shadow:none;}
.search-input{background:#F1EFEB;box-shadow:none;}
.sec-title{font-size:12.5px;font-weight:700;color:#8A857E;letter-spacing:5px;margin:24px 2px 10px;}
.sec-title .dot{display:none;}
.chip{background:#fff;border:1px solid var(--line);box-shadow:none;color:#6F6A64;}
.chip.active{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:none;}
.card-grid{grid-template-columns:1fr;gap:10px;}
.item-card{background:#fff;border:1px solid var(--line);box-shadow:none;border-radius:16px;padding:14px 16px;gap:0;}
.ic-row{display:flex;align-items:center;gap:13px;}
.ic-icon{width:42px;height:42px;border-radius:12px;background:var(--coral-soft) !important;color:var(--coral) !important;box-shadow:none;flex:0 0 auto;}
.ic-icon svg{width:23px;height:23px;}
.ic-body{flex:1;min-width:0;}
.ic-name{font-size:15px;margin:0;}
.ic-sub{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ic-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto;}
.ic-qty{margin:0;}
.ic-qty b{font-size:18px;}
.ic-actions{margin-top:12px;padding-top:11px;border-top:1px solid #F5F2EE;}
.mini-btn{padding:9px 0;}
.mini-btn.use{background:#F5F3F0;box-shadow:none;color:#6F6A64;}
.mini-btn.buy{background:var(--coral-soft);box-shadow:none;color:var(--coral-deep);}
.recent-card{background:#fff;border:1px solid var(--line);box-shadow:none;border-radius:14px;}
.cat-grid{gap:12px;}
.cat-card{background:#fff;border:1px solid var(--line);box-shadow:none;border-radius:16px;align-items:stretch;padding:16px;gap:5px;text-align:left;}
.cc-top{display:flex;align-items:flex-start;justify-content:space-between;}
.cat-card .cc-icon{width:44px;height:44px;border-radius:12px;background:var(--coral-soft);color:var(--coral);box-shadow:none;}
.cat-card .cc-icon svg{width:24px;height:24px;}
.cat-card .cc-name{font-size:15px;margin-top:8px;}
.cat-card .cc-cnt{font-size:11px;}
.cc-sub{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.form-card,.rec-item,.dt-stat{background:#fff;border:1px solid var(--line);box-shadow:none;}
.f-input,.f-textarea,.stepper,.toggle-row,.seg{background:#F5F3F0;box-shadow:none;}
.stepper button{background:#fff;border:1px solid var(--line);box-shadow:none;}
.seg button.active{background:#fff;box-shadow:0 1px 3px rgba(60,45,30,.08);}
.icon-cell{background:#F5F3F0;box-shadow:none;}
.icon-cell.active{background:var(--coral-soft);box-shadow:none;}
.cat-chip{background:#F5F3F0;box-shadow:none;}
.cat-chip.active{background:var(--ink);box-shadow:none;}
.btn-main{box-shadow:none;border-radius:14px;letter-spacing:3px;}
.btn-ghost{background:#F5F3F0;box-shadow:none;border-radius:14px;color:#6F6A64;}
.m-cancel,.big-btn.use,.quick-qty button,.tool-btn{background:#F5F3F0;box-shadow:none;}
.m-ok,.m-ok.danger,.big-btn.buy{box-shadow:none;}
.quick-qty button.active{background:var(--coral-soft);box-shadow:none;}
.ri-icon,.dt-icon{background:var(--coral-soft) !important;color:var(--coral) !important;box-shadow:none;}
.sheet,.modal{background:#FCFBFA;}
.hist-table th{border-bottom:1px solid var(--line);}
.hist-table td{border-bottom:1px solid #F5F2EE;}
.pf-row{border-bottom:1px solid var(--line);}
.bottom-nav{bottom:10px;width:calc(100% - 24px);max-width:456px;border-radius:32px;background:#fff;
  border:1px solid var(--line);box-shadow:0 8px 28px rgba(60,40,20,.10);padding:8px 10px;backdrop-filter:none;}
.nav-btn{color:#2E2A25;padding:9px 20px;border-radius:24px;width:auto;font-size:10.5px;transition:background .15s;}
.nav-btn.active{background:#F3F0EC;color:var(--coral-deep);}
.nav-add{box-shadow:none;width:50px;height:50px;margin-top:-20px;}
#toast{background:#3A352F;}
/* 懸浮新增按鈕 */
.fab{position:fixed;z-index:45;right:max(18px,calc(50% - 222px));bottom:96px;width:56px;height:56px;
  border-radius:50%;border:none;background:var(--coral);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(217,91,57,.35);transition:transform .1s;}
.fab:active{transform:scale(.93);}
.fab svg{width:26px;height:26px;}
.nav-btn{flex:1;}
</style>
</head>
<body>

<div id="app">
  <!-- header -->
  <header class="app-header">
    <div>
      <div class="app-title">家裡還有嗎<span class="q">？</span></div>
      <div class="app-sub" id="headerSub">我們的生活備品小帳本</div>
    </div>
    <div class="sync-pill" id="syncPill" onclick="openSettingsModal()">
      <span class="sync-dot" id="syncDot"></span><span id="syncText">本機模式</span>
    </div>
  </header>

  <!-- ============ HOME ============ -->
  <section class="page" id="page-home">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="search-input" id="searchInput" placeholder="搜尋備品，例如：洗衣精" oninput="onSearch()">
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
    <div class="chip-row" id="filterChips"></div>
    <div id="homeSections"></div>
    <div id="homeFiltered" class="hide">
      <div class="card-grid" id="filteredGrid"></div>
      <div id="filteredEmpty"></div>
    </div>
  </section>

  <!-- ============ CATEGORIES ============ -->
  <section class="page" id="page-cats">
    <div class="sec-title">分類總覽</div>
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <!-- ============ ADD / EDIT FORM ============ -->
  <section class="page" id="page-add">
    <div class="sec-title"><span class="dot"></span><span id="formTitle">新增備品</span></div>
    <div class="form-card">
      <div class="f-label">品名 <span class="req">*</span></div>
      <input class="f-input" id="fName" placeholder="例如：洗衣精" maxlength="30">
      <div class="f-label">分類 <span class="req">*</span></div>
      <div class="cat-chips" id="fCatChips"></div>
      <div class="f-row" style="margin-top:4px">
        <div>
          <div class="f-label" id="fQtyLabel">初始數量</div>
          <div class="stepper">
            <button type="button" onclick="stepQty('fQty',-1)">−</button>
            <input id="fQty" type="number" min="0" value="1" inputmode="numeric">
            <button type="button" onclick="stepQty('fQty',1)">＋</button>
          </div>
        </div>
        <div>
          <div class="f-label">單位</div>
          <input class="f-input" id="fUnit" placeholder="瓶 / 包 / 罐" list="unitList" style="padding:14px 15px">
          <datalist id="unitList">
            <option value="瓶"><option value="包"><option value="罐"><option value="盒">
            <option value="條"><option value="捲"><option value="袋"><option value="顆">
            <option value="組"><option value="支"><option value="片"><option value="串">
          </datalist>
        </div>
      </div>
      <div class="f-label">最低提醒數量　<span style="font-weight:400;color:var(--faint)">低於此數會提醒「快沒了」</span></div>
      <div class="stepper" style="max-width:180px">
        <button type="button" onclick="stepQty('fLow',-1)">−</button>
        <input id="fLow" type="number" min="0" value="1" inputmode="numeric">
        <button type="button" onclick="stepQty('fLow',1)">＋</button>
      </div>
      <div class="f-label">到期日</div>
      <div class="toggle-row">
        <span>設定到期日提醒</span>
        <label class="switch"><input type="checkbox" id="fExpToggle" onchange="document.getElementById('fExpWrap').classList.toggle('hide',!this.checked)"><span class="track"></span><span class="knob"></span></label>
      </div>
      <div id="fExpWrap" class="hide" style="margin-top:10px">
        <input class="f-input" id="fExpiry" type="date">
      </div>
      <div class="f-label">備註</div>
      <textarea class="f-textarea" id="fNote" placeholder="品牌、購買地點、注意事項⋯（選填）" maxlength="200"></textarea>
      <button class="btn-main" id="fSubmit" onclick="submitItemForm()">加入備品清單</button>
      <button class="btn-ghost hide" id="fCancelEdit" onclick="cancelEdit()">取消編輯</button>
    </div>
  </section>

  <!-- ============ RECORDS ============ -->
  <section class="page" id="page-records">
    <div class="sec-title"><span class="dot"></span>紀錄</div>
    <div class="seg">
      <button id="segBuy" class="active" onclick="setRecTab('buy')">補貨紀錄</button>
      <button id="segUse" onclick="setRecTab('use')">使用紀錄</button>
    </div>
    <div class="rec-list" id="recList"></div>
  </section>

</div>

<!-- bottom nav -->
<nav class="bottom-nav">
  <button class="nav-btn" data-page="home" onclick="go('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5h4v5"/></svg>首頁
  </button>
  <button class="nav-btn" data-page="cats" onclick="go('cats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="2.5"/><rect x="13" y="4" width="7" height="7" rx="3.5"/><rect x="4" y="13" width="7" height="7" rx="2.5"/><rect x="13" y="13" width="7" height="7" rx="2.5"/></svg>分類
  </button>
  <button class="nav-btn" data-page="records" onclick="go('records')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/></svg>紀錄
  </button>
</nav>
<button class="fab" onclick="go('add')" aria-label="新增">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- detail sheet -->
<div class="sheet-mask" id="sheetMask" onclick="closeDetail()"></div>
<div class="sheet" id="detailSheet"><div class="sheet-bar"></div><div id="detailBody"></div></div>

<!-- generic modal -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<div id="toast"></div>

<script>
/* ================= icons ================= */
const ICONS = {
  laundry:'<rect x="9.7" y="4.1" width="4.6" height="2.8" rx="0.9"/><rect x="6" y="6.9" width="12" height="13.6" rx="2.9"/><path d="M8.3 13.8c1.2-1 2.5-1 3.7 0s2.5 1 3.7 0"/>',
  pump:'<svg viewBox="0.5 1.5 33 33" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 7H22"/><path d="M17 7V10"/><path d="M14 10H20C22.761 10 25 12.239 25 15V25C25 27.209 23.209 29 21 29H13C10.791 29 9 27.209 9 25V15C9 12.239 11.239 10 14 10Z"/><path d="M14 19H20"/></svg>',
  jar:'<rect x="6.5" y="9" width="11" height="11" rx="3"/><rect x="8" y="5.5" width="8" height="3.5" rx="1.5"/>',
  capsule:'<rect x="4.8" y="8.9" width="14.4" height="6.2" rx="3.1" transform="rotate(-40 12 12)"/><path d="M12 8.9v6.2" transform="rotate(-40 12 12)"/>',
  kitchen:'<path d="M3.5 11.5h11.5v2.3a3.2 3.2 0 0 1-3.2 3.2H6.7a3.2 3.2 0 0 1-3.2-3.2Z"/><path d="M15 13h5.5"/><path d="M7.2 7.8c0-.9.8-.9.8-1.8M10.4 7.8c0-.9.8-.9.8-1.8"/>',
  tp:'<ellipse cx="12" cy="8" rx="6.4" ry="3.4"/><path d="M5.6 8v7.2c0 2 2.9 3.7 6.4 3.7s6.4-1.7 6.4-3.7V8"/><ellipse cx="12" cy="8" rx="2.3" ry="1.25"/>',
  box:'<path d="m4.5 8.2 7.5-3.7 7.5 3.7v7.6l-7.5 3.7-7.5-3.7Z"/><path d="m4.5 8.2 7.5 3.6 7.5-3.6"/><path d="M12 11.8v7.7"/>'
};
function iconSvg(id,cls){
  const p=ICONS[id]||ICONS.box;
  if(p.startsWith('<svg'))return p.replace('<svg',`<svg class="${cls||''}"`);
  return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

/* ================= categories ================= */
const CATS = {
  '洗衣清潔':{icon:'laundry', c:'#8FA9C0', bg:'#E0E8EF'},
  '浴室用品':{icon:'pump',    c:'#7FB5AE', bg:'#DDECE9'},
  '身體保養':{icon:'jar',     c:'#DE9A9A', bg:'#F6E3E3'},
  '保健食品':{icon:'capsule', c:'#D9A661', bg:'#F5E8D3'},
  '廚房用品':{icon:'kitchen', c:'#A0B579', bg:'#E8EDDA'},
  '紙品耗材':{icon:'tp',      c:'#B79ACD', bg:'#EBE2F2'},
  '其他':    {icon:'box',     c:'#A2947F', bg:'#ECE5D8'}
};
const CAT_NAMES = Object.keys(CATS);
function catMeta(c){return CATS[c]||CATS['其他'];}

/* ================= built-in Firebase config ================= */
/* 部署時由開發者填入；有值時預設開啟雲端共同編輯 */
const DEFAULT_FB_CONFIG = {
  apiKey: "AIzaSyBMgq38zDvxx6-BKryGDld3RqOgs9-Vot0",
  authDomain: "home-stock-app-63946.firebaseapp.com",
  projectId: "home-stock-app-63946",
  storageBucket: "home-stock-app-63946.firebasestorage.app",
  messagingSenderId: "135210721087",
  appId: "1:135210721087:web:55a6b0aa619e3d3cf5fd8a"
};

/* ================= utils ================= */
const $=id=>document.getElementById(id);
const uid=()=> (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const nowISO=()=>new Date().toISOString();
function fmtDate(s){if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[0]}/${p[1]}/${p[2]}`:s;}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function daysUntil(dateStr){if(!dateStr)return Infinity;return Math.ceil((new Date(dateStr+'T00:00:00')-new Date())/(864e5));}

/* item status: 'out' | 'low' | 'exp' | 'ok' */
function itemStatus(it){
  if((it.currentQuantity??0)<=0)return 'out';
  if((it.currentQuantity??0)<=(it.lowStockThreshold??0))return 'low';
  if(it.expiryDate&&daysUntil(it.expiryDate)<=30)return 'exp';
  return 'ok';
}
const STATUS_BADGE={out:'<span class="badge out">需要補貨</span>',low:'<span class="badge low">快沒了</span>',exp:'<span class="badge exp">即將到期</span>',ok:'<span class="badge ok">充足</span>'};

/* ================= state ================= */
let state={items:[],purchases:[],usages:[]};
let mode='local';   // boot() 依有無 Firebase 設定決定 'local' | 'cloud'
let currentPage='home';
let activeFilter='all';      // all | low | out | exp | recent | cat:XXX
let searchQ='';
let recTab='buy';
let editingId=null;          // item id being edited
let detailId=null;
let DB=null;

const me=()=> DB&&DB.userName?DB.userName():'我';

/* ================= Local adapter ================= */
const LocalDB={
  name:'local',
  load(){
    try{
      state.items=JSON.parse(localStorage.getItem('hyh_items')||'null')||[];
      state.purchases=JSON.parse(localStorage.getItem('hyh_purchases')||'[]');
      state.usages=JSON.parse(localStorage.getItem('hyh_usages')||'[]');
      if(localStorage.getItem('hyh_items')===null){seedDemo();this.persist();}
    }catch(e){state={items:[],purchases:[],usages:[]};}
    renderAll();
  },
  persist(){
    localStorage.setItem('hyh_items',JSON.stringify(state.items));
    localStorage.setItem('hyh_purchases',JSON.stringify(state.purchases));
    localStorage.setItem('hyh_usages',JSON.stringify(state.usages));
  },
  userName(){return localStorage.getItem('hyh_username')||'我';},
  async addItem(d){const it={...d,id:uid(),createdBy:this.userName(),updatedBy:this.userName(),createdAt:nowISO(),updatedAt:nowISO()};state.items.push(it);this.persist();renderAll();return it.id;},
  async updateItem(id,d){const it=state.items.find(i=>i.id===id);if(!it)return;Object.assign(it,d,{updatedBy:this.userName(),updatedAt:nowISO()});this.persist();renderAll();},
  async deleteItem(id){state.items=state.items.filter(i=>i.id!==id);state.purchases=state.purchases.filter(r=>r.itemId!==id);state.usages=state.usages.filter(r=>r.itemId!==id);this.persist();renderAll();},
  async addPurchase(r){state.purchases.push({...r,id:uid(),createdBy:this.userName(),createdAt:nowISO()});this.persist();renderAll();},
  async addUsage(r){state.usages.push({...r,id:uid(),createdBy:this.userName(),createdAt:nowISO()});this.persist();renderAll();}
};

function seedDemo(){
  const mk=(name,cat,icon,qty,unit,low,note,expiry)=>({id:uid(),name,category:cat,icon,currentQuantity:qty,unit,lowStockThreshold:low,note:note||'',expiryDate:expiry||'',createdBy:'我',updatedBy:'我',createdAt:nowISO(),updatedAt:nowISO()});
  const a=mk('洗衣精','洗衣清潔','laundry',2,'瓶',1,'常用：藍色那罐');
  const b=mk('衛生紙','紙品耗材','tp',1,'串',1,'Costco 買比較划算');
  const c=mk('洗髮精','浴室用品','pump',1,'瓶',1);
  const d=mk('維他命C','保健食品','capsule',0,'罐',1,'',addDays(20));
  const e=mk('洗面乳','身體保養','jar',3,'條',1);
  const f=mk('洗碗精','廚房用品','kitchen',1,'瓶',1);
  state.items=[a,b,c,d,e,f];
  state.purchases=[
    {id:uid(),itemId:a.id,purchaseDate:todayStr(),quantity:2,unit:'瓶',note:'Costco',createdBy:'我',createdAt:nowISO()},
    {id:uid(),itemId:a.id,purchaseDate:addDays(-34),quantity:1,unit:'瓶',note:'家樂福',createdBy:'我',createdAt:nowISO()},
    {id:uid(),itemId:b.id,purchaseDate:addDays(-10),quantity:1,unit:'串',note:'Costco 特價',createdBy:'我',createdAt:nowISO()}
  ];
  state.usages=[{id:uid(),itemId:e.id,usedDate:addDays(-3),quantity:1,note:'',createdBy:'我',createdAt:nowISO()}];
}
function addDays(n){const d=new Date(Date.now()+n*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ================= Firebase adapter (免登入・開放共用) ================= */
const CloudDB={
  name:'cloud', fb:null, hid:'our-home', ready:false, unsubs:[],
  userName(){return localStorage.getItem('hyh_username')||'我';},
  async init(){
    const cfg=getFbConfig();
    if(!cfg)return false;
    if(!this.fb){
      const [appM,fsM]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
      ]);
      const app=appM.initializeApp(cfg);
      this.fb={db:fsM.getFirestore(app),F:fsM};
    }
    this.attach();
    return true;
  },
  attach(){
    this.detach();
    const {db,F}=this.fb;
    const sub=(coll,key)=>this.unsubs.push(F.onSnapshot(F.collection(db,'households',this.hid,coll),s=>{
      state[key]=s.docs.map(d=>({id:d.id,...d.data()}));this.ready=true;renderAll();
    },e=>{console.warn(e);toast('同步發生問題，請重新整理');}));
    sub('items','items');sub('purchases','purchases');sub('usages','usages');
  },
  detach(){this.unsubs.forEach(u=>u());this.unsubs=[];this.ready=false;},
  col(c){const {db,F}=this.fb;return F.collection(db,'households',this.hid,c);},
  async addItem(d){const {F}=this.fb;const r=await F.addDoc(this.col('items'),{...d,createdBy:this.userName(),updatedBy:this.userName(),createdAt:nowISO(),updatedAt:nowISO()});return r.id;},
  async updateItem(id,d){const {db,F}=this.fb;await F.updateDoc(F.doc(db,'households',this.hid,'items',id),{...d,updatedBy:this.userName(),updatedAt:nowISO()});},
  async deleteItem(id){
    const {db,F}=this.fb;
    await F.deleteDoc(F.doc(db,'households',this.hid,'items',id));
    for(const c of ['purchases','usages']){
      const snap=await F.getDocs(F.query(this.col(c),F.where('itemId','==',id)));
      await Promise.all(snap.docs.map(d=>F.deleteDoc(d.ref)));
    }
  },
  async addPurchase(r){const {F}=this.fb;await F.addDoc(this.col('purchases'),{...r,createdBy:this.userName(),createdAt:nowISO()});},
  async addUsage(r){const {F}=this.fb;await F.addDoc(this.col('usages'),{...r,createdBy:this.userName(),createdAt:nowISO()});}
};

function getFbConfig(){try{return JSON.parse(localStorage.getItem('hyh_fbconfig')||'null')||DEFAULT_FB_CONFIG;}catch(e){return DEFAULT_FB_CONFIG;}}

async function boot(){
  if(getFbConfig()){
    mode='cloud';DB=CloudDB;
    try{await CloudDB.init();}
    catch(e){console.warn(e);toast('雲端連線失敗，先用本機模式');mode='local';DB=LocalDB;LocalDB.load();}
    if(mode==='cloud'&&!localStorage.getItem('hyh_username'))openNameModal();
  }else{
    mode='local';DB=LocalDB;LocalDB.load();
  }
  renderAll();
}

/* ================= navigation ================= */
function go(p){
  currentPage=p;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('show'));
  $('page-'+p).classList.add('show');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  if(p==='add'&&!editingId)resetItemForm();
  if(p!=='add'&&editingId)cancelEdit(true);
  renderAll();
  window.scrollTo({top:0});
}

/* ================= render root ================= */
function renderAll(){

function renderSyncPill(){

/* ================= home ================= */
const FILTERS=[
  {id:'all',label:'全部'},{id:'low',label:'快沒了'},{id:'out',label:'需要補貨'},
  {id:'exp',label:'即將到期'},{id:'recent',label:'最近補貨'}
];
function counts(){
  const c={low:0,out:0,exp:0};
  state.items.forEach(i=>{const s=itemStatus(i);if(c[s]!==undefined)c[s]++;});
  return c;
}
function renderHome(){
  const c=counts();
  const catChip=activeFilter.startsWith('cat:')
    ?`<button class="chip active" onclick="setFilter('all')">${esc(activeFilter.slice(4))} ✕</button>`:'';
  $('filterChips').innerHTML=catChip+FILTERS.map(f=>{
    const n=f.id==='all'?state.items.length:(c[f.id]??null);
    return `<button class="chip ${activeFilter===f.id?'active':''}" onclick="setFilter('${f.id}')">${f.label}${n!==null&&n!==undefined?`<span class="cnt">${n}</span>`:''}</button>`;
  }).join('');
  const filtering=searchQ||activeFilter!=='all';
  $('homeSections').classList.toggle('hide',filtering);
  $('homeFiltered').classList.toggle('hide',!filtering);
  if(filtering){
    let list=state.items.filter(i=>!searchQ||i.name.toLowerCase().includes(searchQ.toLowerCase()));
    if(activeFilter.startsWith('cat:'))list=list.filter(i=>i.category===activeFilter.slice(4));
    else if(activeFilter==='low')list=list.filter(i=>itemStatus(i)==='low');
    else if(activeFilter==='out')list=list.filter(i=>itemStatus(i)==='out');
    else if(activeFilter==='exp')list=list.filter(i=>i.expiryDate&&daysUntil(i.expiryDate)<=30);
    else if(activeFilter==='recent'){
      const ids=[...state.purchases].sort((a,b)=>b.purchaseDate.localeCompare(a.purchaseDate)).map(p=>p.itemId);
      list=list.filter(i=>ids.includes(i.id)).sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
    }
    $('filteredGrid').innerHTML=list.map(cardHTML).join('');
    $('filteredEmpty').innerHTML=list.length?'':emptyHTML('找不到符合的備品','換個關鍵字或篩選看看');
  }else{
    const need=state.items.filter(i=>['out','low'].includes(itemStatus(i)));
    const recent=[...state.purchases].sort((a,b)=>(b.purchaseDate+b.createdAt).localeCompare(a.purchaseDate+a.createdAt)).slice(0,8);
    let html='';
    if(need.length){
      html+=`<div class="sec-title"><span class="dot" style="background:var(--amber)"></span>快沒了・該補貨</div><div class="card-grid">${need.map(cardHTML).join('')}</div>`;
    }
    if(recent.length){
      html+=`<div class="sec-title"><span class="dot" style="background:var(--green)"></span>最近補貨</div><div class="recent-strip">${recent.map(r=>{
        const it=state.items.find(i=>i.id===r.itemId);if(!it)return '';
        const m=catMeta(it.category);
        return `<div class="recent-card" onclick="openDetail('${it.id}')">
          <div class="rc-name">${esc(it.name)}</div>
          <div class="rc-info">${fmtDate(r.purchaseDate)}・+${r.quantity} ${esc(r.unit||it.unit)}</div>
          ${r.note?`<div class="rc-note">${esc(r.note)}</div>`:''}</div>`;
      }).join('')}</div>`;
    }
    html+=`<div class="sec-title"><span class="dot"></span>全部備品</div>`;
    html+=state.items.length?`<div class="card-grid">${[...state.items].sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant')).map(cardHTML).join('')}</div>`
      :emptyHTML('還沒有任何備品','點下方的「＋」新增第一個吧');
    $('homeSections').innerHTML=html;
  }
}
function emptyHTML(t,s){return `<div class="empty">${t}<br><span style="font-size:12px">${s}</span></div>`;}
function cardHTML(it){
  const st=itemStatus(it);
  const last=lastPurchase(it.id);
  return `<div class="item-card" onclick="openDetail('${it.id}')">
    <div class="ic-row">
      <div class="ic-icon">${iconSvg(catMeta(it.category).icon)}</div>
      <div class="ic-body">
        <div class="ic-name">${esc(it.name)}</div>
        <div class="ic-sub">${esc(it.category)}・最近購買 ${last?fmtDate(last.purchaseDate):'—'}</div>
      </div>
      <div class="ic-right">
        <div class="ic-qty ${st==='out'?'zero':st==='low'?'warn':''}"><b>${it.currentQuantity??0}</b><span>${esc(it.unit||'')}</span></div>
        ${STATUS_BADGE[st]}
      </div>
    </div>
    <div class="ic-actions">
      <button class="mini-btn use" onclick="event.stopPropagation();openUseModal('${it.id}')">用掉了</button>

}
function lastPurchase(itemId){
  return state.purchases.filter(p=>p.itemId===itemId).sort((a,b)=>b.purchaseDate.localeCompare(a.purchaseDate))[0];
}
function setFilter(f){activeFilter=f;renderHome();}
function onSearch(){searchQ=$('searchInput').value.trim();$('searchClear').style.display=searchQ?'block':'none';renderHome();}
function clearSearch(){$('searchInput').value='';onSearch();}

/* ================= add / edit form ================= */
let fCat='洗衣清潔';
function buildFormStatics(){
  $('fCatChips').innerHTML=CAT_NAMES.map(c=>{
    const m=CATS[c];
    return `<button type="button" class="cat-chip ${fCat===c?'active':''}" data-cat="${c}" onclick="pickCat('${c}')">${iconSvg(m.icon)}${c}</button>`;
  }).join('');
}
function pickCat(c){fCat=c;buildFormStatics();}
function stepQty(id,d){const el=$(id);el.value=Math.max(0,(parseInt(el.value)||0)+d);}
function resetItemForm(){
  editingId=null;fCat='洗衣清潔';
  $('formTitle').textContent='新增備品';$('fSubmit').textContent='加入備品清單';
  $('fCancelEdit').classList.add('hide');$('fQtyLabel').textContent='初始數量';
  $('fQty').parentElement.parentElement.classList.remove('hide');
  $('fName').value='';$('fQty').value=1;$('fUnit').value='';$('fLow').value=1;$('fNote').value='';
  $('fExpToggle').checked=false;$('fExpiry').value='';$('fExpWrap').classList.add('hide');
  buildFormStatics();
}
function startEdit(id){
  const it=state.items.find(i=>i.id===id);if(!it)return;
  closeDetail();
  editingId=id;fCat=it.category;
  go('add');
  $('formTitle').textContent='編輯備品';$('fSubmit').textContent='儲存變更';
  $('fCancelEdit').classList.remove('hide');
  $('fName').value=it.name;$('fQty').value=it.currentQuantity??0;$('fQtyLabel').textContent='目前數量';
  $('fUnit').value=it.unit||'';$('fLow').value=it.lowStockThreshold??0;$('fNote').value=it.note||'';
  const hasExp=!!it.expiryDate;
  $('fExpToggle').checked=hasExp;$('fExpiry').value=it.expiryDate||'';$('fExpWrap').classList.toggle('hide',!hasExp);
  buildFormStatics();
}
function cancelEdit(silent){editingId=null;resetItemForm();if(!silent)go('home');}
async function submitItemForm(){
  const name=$('fName').value.trim();
  if(!name){toast('請填寫品名');$('fName').focus();return;}
  const d={
    name,category:fCat,icon:CATS[fCat].icon,
    currentQuantity:Math.max(0,parseInt($('fQty').value)||0),
    unit:$('fUnit').value.trim()||'個',
    lowStockThreshold:Math.max(0,parseInt($('fLow').value)||0),
    expiryDate:$('fExpToggle').checked?($('fExpiry').value||''):'',
    note:$('fNote').value.trim()
  };
  if(mode==='cloud'&&!CloudDB.fb){toast('還在連線中，稍等一下再試');return;}
  if(editingId){await DB.updateItem(editingId,d);toast('已更新「'+name+'」');editingId=null;}
  else{await DB.addItem(d);toast('已加入「'+name+'」');}
  resetItemForm();go('home');
}

/* ================= modals ================= */
let modalCtx={};
function openModal(html){$('modalBox').innerHTML=html;$('modalMask').classList.add('show');}
function closeModal(){$('modalMask').classList.remove('show');modalCtx={};}

/* --- 用掉了 --- */
function openUseModal(id){
  const it=state.items.find(i=>i.id===id);if(!it)return;
  if((it.currentQuantity??0)<=0){toast('已經沒庫存了，先補貨吧');openBuyModal(id);return;}
  modalCtx={id,qty:1};
  openModal(`
    <div class="m-title">用掉了</div>
    <div class="m-sub">${esc(it.name)}・目前 ${it.currentQuantity} ${esc(it.unit)}</div>
    <div class="quick-qty">
      <button id="uq1" class="active" onclick="setUseQty(1)">1 ${esc(it.unit)}</button>
      <button id="uq2" onclick="setUseQty(2)">2 ${esc(it.unit)}</button>
      <button id="uqc" onclick="setUseQty('c')">自訂</button>
    </div>
    <div id="useCustom" class="hide" style="margin-top:12px">
      <div class="stepper"><button onclick="stepQty('useQtyInput',-1)">−</button><input id="useQtyInput" type="number" min="1" value="1" inputmode="numeric"><button onclick="stepQty('useQtyInput',1)">＋</button></div>
    </div>
    <div class="f-label">備註（選填）</div>
    <input class="f-input" id="useNote" placeholder="例如：拿去旅行用">
    <div class="m-btns"><button class="m-cancel" onclick="closeModal()">取消</button><button class="m-ok" onclick="confirmUse()">確定</button></div>`);
}
function setUseQty(q){
  modalCtx.qty=q;
  ['uq1','uq2','uqc'].forEach(i=>$(i).classList.remove('active'));
  $(q==='c'?'uqc':q===1?'uq1':'uq2').classList.add('active');
  $('useCustom').classList.toggle('hide',q!=='c');
}
async function confirmUse(){
  const it=state.items.find(i=>i.id===modalCtx.id);if(!it)return;
  let q=modalCtx.qty==='c'?(parseInt($('useQtyInput').value)||1):modalCtx.qty;
  q=Math.min(q,it.currentQuantity??0);
  if(q<=0){closeModal();return;}
  const newQty=(it.currentQuantity??0)-q;
  await DB.addUsage({itemId:it.id,usedDate:todayStr(),quantity:q,unit:it.unit,note:$('useNote').value.trim()});
  await DB.updateItem(it.id,{currentQuantity:newQty});
  closeModal();
  if(newQty<=0)toast(`「${it.name}」需要補貨了`);
  else if(newQty<=(it.lowStockThreshold??0))toast(`「${it.name}」快沒了，剩 ${newQty} ${it.unit}`);
  else toast(`已記錄，剩 ${newQty} ${it.unit}`);
}

/* --- 補貨 --- */
function openBuyModal(id){
  const it=state.items.find(i=>i.id===id);if(!it)return;
  modalCtx={id};
  openModal(`
    <div class="m-title">補貨</div>
    <div class="m-sub">${esc(it.name)}・目前 ${it.currentQuantity??0} ${esc(it.unit)}</div>
    <div class="f-label">補貨日期</div>
    <input class="f-input" id="buyDate" type="date" value="${todayStr()}">
    <div class="f-row" style="margin-top:2px">
      <div><div class="f-label">數量</div>
        <div class="stepper"><button onclick="stepBuy(-1)">−</button><input id="buyQty" type="number" min="1" value="1" inputmode="numeric"><button onclick="stepBuy(1)">＋</button></div>
      </div>
      <div><div class="f-label">單位</div>
        <input class="f-input" id="buyUnit" value="${esc(it.unit)}" list="unitList" style="padding:14px 15px">
      </div>
    </div>
    <div class="f-label">備註（選填）</div>
    <input class="f-input" id="buyNote" placeholder="在哪買、品牌、價格⋯">
    <div class="m-btns"><button class="m-cancel" onclick="closeModal()">取消</button><button class="m-ok" onclick="confirmBuy()">補貨完成</button></div>`);
}
function stepBuy(d){const el=$('buyQty');el.value=Math.max(1,(parseInt(el.value)||1)+d);}
async function confirmBuy(){
  const it=state.items.find(i=>i.id===modalCtx.id);if(!it)return;
  const q=Math.max(1,parseInt($('buyQty').value)||1);
  const rec={itemId:it.id,purchaseDate:$('buyDate').value||todayStr(),quantity:q,unit:$('buyUnit').value.trim()||it.unit,note:$('buyNote').value.trim()};
  await DB.addPurchase(rec);
  await DB.updateItem(it.id,{currentQuantity:(it.currentQuantity??0)+q});
  closeModal();toast(`補貨 +${q} ${rec.unit}，現在有 ${(it.currentQuantity??0)+q} ${it.unit}`);
}

/* ================= records page ================= */
function setRecTab(t){recTab=t;$('segBuy').classList.toggle('active',t==='buy');$('segUse').classList.toggle('active',t==='use');renderRecords();}
function renderRecords(){
  const isBuy=recTab==='buy';
  const recs=(isBuy?state.purchases:state.usages)
    .map(r=>({...r,_d:isBuy?r.purchaseDate:r.usedDate}))
    .sort((a,b)=>((b._d||'')+(b.createdAt||'')).localeCompare((a._d||'')+(a.createdAt||'')));
  if(!recs.length){$('recList').innerHTML=emptyHTML(isBuy?'還沒有補貨紀錄':'還沒有使用紀錄','從品項卡片按「'+(isBuy?'補貨':'用掉了')+'」開始記錄');return;}
  let html='',lastD='';
  recs.forEach(r=>{
    const it=state.items.find(i=>i.id===r.itemId);
    const m=catMeta(it?it.category:'其他');
    if(r._d!==lastD){lastD=r._d;html+=`<div class="rec-date-h">${fmtDate(r._d)}</div>`;}
    html+=`<div class="rec-item" ${it?`onclick="openDetail('${it.id}')"`:''}>
      <div class="ri-icon" style="background:${m.bg};color:${m.c}">${iconSvg(m.icon)}</div>
      <div class="ri-body"><div class="ri-name">${esc(it?it.name:'（已刪除的品項）')}</div>
      <div class="ri-sub">${esc(r.createdBy||'')}${r.note?'・'+esc(r.note):''}</div></div>
      <div class="ri-qty ${isBuy?'plus':'minus'}">${isBuy?'+':'−'}${r.quantity} ${esc(r.unit||(it?it.unit:''))}</div></div>`;
  });
  $('recList').innerHTML=html;
}

function openSettingsModal(){
  const cloud=mode==='cloud';
  const name=localStorage.getItem('hyh_username')||'';
  openModal(`
    <div class="m-title">設定</div>
    <div class="m-sub">${cloud?'雲端同步版・和另一半共用同一份清單':'本機模式・資料只存在這台裝置'}</div>
    <div class="f-label">我的稱呼（記錄是誰補貨、誰用掉）</div>
    <input class="f-input" id="pfName" value="${esc(name)}" maxlength="10" placeholder="例如：阿倫">
    ${cloud?`
    <div class="f-label">同步狀態</div>
    <div class="pf-row" style="padding:6px 2px"><span class="k">即時同步</span><span class="v" style="color:#6E8A66">${CloudDB.ready?'已連線':'連線中'}</span></div>
    <div class="hint">把這個網頁的網址傳給另一半，打開就能一起編輯。</div>
    <button class="btn-ghost" onclick="copyText(location.href)">複製網頁網址</button>`
    :`
    <div class="hint" style="margin-top:14px">這是新版 UI 預覽，用本機範例資料試玩；確認喜歡後我會接回雲端並更新線上版。</div>
    <button class="btn-ghost" onclick="if(confirm('確定要清空本機所有資料？')){localStorage.removeItem('hyh_items');localStorage.removeItem('hyh_purchases');localStorage.removeItem('hyh_usages');LocalDB.load();closeModal();toast('已重設為範例資料');}">重設本機資料（載入範例）</button>`}
    <div class="m-btns"><button class="m-cancel" onclick="closeModal()">關閉</button><button class="m-ok" onclick="savePfName()">儲存</button></div>`);
}
function savePfName(){
  const n=$('pfName').value.trim();
  if(!n){toast('輸入一個名字吧');return;}
  localStorage.setItem('hyh_username',n);
  closeModal();renderAll();toast('已更新稱呼');
}
function copyText(t){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('已複製')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已複製');
  });
}

/* --- Firebase setup wizard --- */
function openSetupModal(){
  const cfg=getFbConfig();
  openModal(`
    <div class="m-title">連接 Firebase</div>
    <div class="m-sub">免費，大約 5 分鐘就能完成</div>
    <div style="margin-top:14px">
      <div class="setup-step"><span class="step-num">1</span><span>到 <b>console.firebase.google.com</b> 建立專案（名稱隨意）。</span></div>
      <div class="setup-step"><span class="step-num">2</span><span>左側 <b>Firestore Database → 建立資料庫</b>，然後到「規則」貼上下面這段：</span></div>
      <div class="code-box" id="rulesBox">${esc(FIRESTORE_RULES)}</div>
      <button class="btn-ghost" style="margin-top:8px" onclick="copyText(FIRESTORE_RULES)">複製規則</button>
      <div class="setup-step"><span class="step-num">3</span><span>專案設定 → 你的應用程式 → 新增「網頁應用程式」，複製 <b>firebaseConfig</b> 物件貼到下面。</span></div>
    </div>
    <div class="f-label">貼上 firebaseConfig</div>
    <textarea class="f-textarea" id="cfgInput" style="min-height:110px;font-family:monospace;font-size:11.5px" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "...", ... }'>${cfg?esc(JSON.stringify(cfg,null,2)):''}</textarea>
    <div class="m-btns"><button class="m-cancel" onclick="closeModal()">取消</button><button class="m-ok" onclick="saveFbConfig()">儲存並連線</button></div>`);
}
function saveFbConfig(){
  let raw=$('cfgInput').value.trim();
  // tolerate "const firebaseConfig = {...};" paste
  const m=raw.match(/\{[\s\S]*\}/);
  if(m)raw=m[0];
  let cfg;
  try{cfg=JSON.parse(raw);}
  catch(e){
    try{cfg=(new Function('return ('+raw+')'))();}
    catch(e2){toast('看不懂這段設定，請貼完整的 firebaseConfig');return;}
  }
  if(!cfg||!cfg.apiKey||!cfg.projectId){toast('缺少 apiKey 或 projectId');return;}
  localStorage.setItem('hyh_fbconfig',JSON.stringify(cfg));
  closeModal();
  location.reload();
}
